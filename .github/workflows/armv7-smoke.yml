name: Raspberry Pi ARMv7 Docker smoke test

on:
  pull_request:
    paths:
      - Dockerfile
      - requirements.txt
      - setup.py
      - TwitchChannelPointsMiner/classes/AnalyticsServer.py
      - .github/workflows/armv7-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  armv7:
    name: Build and test linux/arm/v7
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up ARMv7 QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the Raspberry Pi image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm/v7
          push: false
          load: true
          tags: local/twitch-miner-armv7:ci
          cache-from: type=gha,scope=miner-armv7
          cache-to: type=gha,scope=miner-armv7-ci,mode=max
      - name: Confirm Python and analytics start without pandas
        shell: bash
        run: |
          docker run --rm --platform linux/arm/v7 --entrypoint python \
            local/twitch-miner-armv7:ci -c \
            'import importlib.util; assert importlib.util.find_spec("pandas") is None; from TwitchChannelPointsMiner.classes.AnalyticsServer import filter_datas; assert len(filter_datas(None, None, {})["series"]) == 2; print("ARMv7 analytics import OK")'
