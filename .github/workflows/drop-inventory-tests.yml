name: Test Drop inventory selection

on:
  pull_request:
    paths:
      - 'TwitchChannelPointsMiner/**'
      - 'tests/**'
      - '.github/workflows/drop-inventory-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-claimed-drop-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply the same runtime patches as the Docker image
        run: |
          patch --batch --forward -p1 < patches/drop-campaign-state-machine.patch
          patch --batch --forward -p1 < patches/drop-campaign-single-progress.patch
      - name: Test claimed Drop selection and campaign handoff
        run: python -m unittest discover -s tests -v
