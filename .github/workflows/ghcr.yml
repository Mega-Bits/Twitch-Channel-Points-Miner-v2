name: Build and publish container

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/mega-bits/twitch-channel-points-miner-v2
  VERSION_FILE: TwitchChannelPointsMiner/VERSION

jobs:
  build:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU (ARM only)
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:build-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            BUILDX_QEMU_ENV=true
          cache-from: type=gha,scope=miner-${{ matrix.arch }}
          cache-to: type=gha,scope=miner-${{ matrix.arch }},mode=max

  publish:
    name: Publish multi-arch manifest
    needs: build
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < "${VERSION_FILE}")"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi
          CORE_VERSION="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CORE_VERSION}"
          PRERELEASE=false
          if [[ "${VERSION}" == *-* ]]; then PRERELEASE=true; fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]] && [[ "${GITHUB_REF_NAME#v}" != "${VERSION}" ]]; then
            echo "Git tag does not match version file" >&2
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "major=${MAJOR}"
            echo "minor=${MINOR}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=v${{ steps.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }},enable=${{ startsWith(github.ref, 'refs/tags/v') && steps.version.outputs.prerelease == 'false' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ startsWith(github.ref, 'refs/tags/v') && steps.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && steps.version.outputs.prerelease == 'false' }}
      - name: Publish manifest for all architectures
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r tag; do
            if [[ -n "${tag}" ]]; then tags+=("-t" "${tag}"); fi
          done <<< "${IMAGE_TAGS}"
          if (( ${#tags[@]} == 0 )); then echo "No image tags generated" >&2; exit 1; fi
          docker buildx imagetools create "${tags[@]}" \
            "${IMAGE_NAME}:build-${GITHUB_SHA}-amd64" \
            "${IMAGE_NAME}:build-${GITHUB_SHA}-arm64" \
            "${IMAGE_NAME}:build-${GITHUB_SHA}-armv7"
          docker buildx imagetools inspect "${tags[1]}"
