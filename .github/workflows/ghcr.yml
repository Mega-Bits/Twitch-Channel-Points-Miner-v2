name: Build and publish container

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/mega-bits/twitch-channel-points-miner-v2
  VERSION_FILE: TwitchChannelPointsMiner/VERSION

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < "${VERSION_FILE}")"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version in ${VERSION_FILE}: ${VERSION}" >&2
            exit 1
          fi

          CORE_VERSION="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CORE_VERSION}"
          PRERELEASE=false
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE=true
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" != "${VERSION}" ]]; then
              echo "Git tag v${TAG_VERSION} does not match ${VERSION_FILE} (${VERSION})" >&2
              exit 1
            fi
          fi

          {
            echo "version=${VERSION}"
            echo "major=${MAJOR}"
            echo "minor=${MINOR}"
            echo "patch=${PATCH}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=v${{ steps.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }},enable=${{ startsWith(github.ref, 'refs/tags/v') && steps.version.outputs.prerelease == 'false' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ startsWith(github.ref, 'refs/tags/v') && steps.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && steps.version.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/Mega-Bits/Twitch-Channel-Points-Miner-v2

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDX_QEMU_ENV=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
